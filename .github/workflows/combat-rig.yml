name: Combat rig geometry
on:
  pull_request:
    paths:
      - 'src/fighter-rig.js'
      - 'src/combat-anatomy.js'
      - 'src/figure-anatomy.js'
      - 'src/iso-fight.js'
      - 'src/gym.js'
      - 'tests/**'
      - '.github/workflows/combat-rig.yml'
  push:
    branches: [main]
    paths:
      - 'src/fighter-rig.js'
      - 'src/combat-anatomy.js'
      - 'src/iso-fight.js'
      - 'tests/**'
      - '.github/workflows/combat-rig.yml'
permissions:
  contents: read
jobs:
  unit-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax of new combat modules
        run: |
          node --check src/fighter-rig.js
          node --check src/iso-fight.js
          node --check src/figure-anatomy.js
          node --check src/combat-anatomy.js
          node --check src/gym.js
      - name: Automated tests
        run: npm test
      - name: TypeScript checks
        run: npm run check
